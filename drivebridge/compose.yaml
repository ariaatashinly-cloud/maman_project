services:
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?required}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_data:/var/lib/telegram-bot-api
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    depends_on: [telegram-api]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:?required}
      TELEGRAM_API_URL: http://telegram-api:8081
      TELEGRAM_FILES_ROOT: /var/lib/telegram-bot-api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?required}
      GOOGLE_FOLDER_ID: ${GOOGLE_FOLDER_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-5}
      DATA_DIR: /data
      SECURE_COOKIE: "1"
    volumes:
      - app_data:/data
      - telegram_data:/var/lib/telegram-bot-api:ro
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    depends_on: [app]
    networks: [internal]

networks:
  internal:
volumes:
  app_data:
  telegram_data:
